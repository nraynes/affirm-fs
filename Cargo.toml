[package]
name = "affirm-fs"
version = "0.5.7"
edition = "2024"
authors = ["Nicholas Raynes"]
description = "Assert things about a file system. Inspired by assert-fs."
license  = "MIT OR Apache-2.0"
repository = "https://github.com/nraynes/affirm-fs"
keywords = ["rust", "terminal", "command", "console", "tools"]
categories = ["development-tools"]
include = [
    "src/",
    "examples/",
    "Cargo.toml",
    "LICENSES/",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[dependencies]
derive-getters = "0.5.0"
derive-new = "0.7.0"
rust-alert = "0.3.0"
sha256 = "1.6.0"

[dev-dependencies]
mocked-up = "0.3.4"
